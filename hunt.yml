name: Job Hunter Agent

on:
  schedule:
    # Runs every 6 hours (4x/day) — matches Remotive's requested API rate limit.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job hunter agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREELANCER_API_KEY: ${{ secrets.FREELANCER_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python agent.py

      - name: Commit updated job data
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --quiet --cached || git commit -m "Update job leads [skip ci]"
          git push

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    needs: hunt
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
