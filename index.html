<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Radar — Job Hunter Dashboard</title>
<style>
  :root {
    --bg: #090d13;
    --bg-grid: #101823;
    --panel: #121b27;
    --panel-line: #223247;
    --ink: #eaf1f7;
    --ink-dim: #7d90a8;
    --radar: #39e991;
    --radar-dim: #14472f;
    --amber: #f2a93c;
    --red: #ef6459;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% -10%, #10202a 0%, var(--bg) 55%),
      repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 40px);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    padding: 40px 32px 28px;
    border-bottom: 1px solid var(--panel-line);
    display: flex;
    align-items: center;
    gap: 36px;
    overflow: hidden;
  }
  .radar-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    flex-shrink: 0;
  }
  .radar-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--radar-dim);
  }
  .radar-ring.r2 { inset: 18px; }
  .radar-ring.r3 { inset: 36px; }
  .radar-ring.r4 { inset: 54px; }
  .radar-sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, var(--radar) 340deg, transparent 360deg);
    animation: spin 3.2s linear infinite;
    opacity: 0.85;
  }
  .radar-core {
    position: absolute;
    inset: 50%;
    width: 6px; height: 6px;
    margin: -3px;
    border-radius: 50%;
    background: var(--radar);
    box-shadow: 0 0 12px 3px var(--radar);
  }
  .blip {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--radar);
    box-shadow: 0 0 8px 2px var(--radar);
    animation: blip-pulse 2.4s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blip-pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  .radar-wrap { animation: breathe 4.2s ease-in-out infinite; }

  /* Full-page scan line sweeping top to bottom, sitting behind all content */
  .scan-line {
    position: fixed;
    left: 0; right: 0;
    height: 140px;
    top: -140px;
    background: linear-gradient(to bottom, transparent, rgba(57,233,145,0.05) 50%, transparent);
    pointer-events: none;
    z-index: 0;
    animation: scan-sweep 7s linear infinite;
  }
  @keyframes scan-sweep { to { transform: translateY(calc(100vh + 140px)); } }

  .live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--radar);
    margin-right: 6px;
    box-shadow: 0 0 6px 1px var(--radar);
    animation: blip-pulse 1.6s ease-in-out infinite;
  }

  .hero, .controls, .board, #empty-state { position: relative; z-index: 1; }

  .score.hi { animation: score-glow 2.2s ease-in-out infinite; }
  @keyframes score-glow {
    0%, 100% { box-shadow: 0 0 0 rgba(57,233,145,0); }
    50% { box-shadow: 0 0 10px 1px rgba(57,233,145,0.35); }
  }

  .column-title span:first-child { position: relative; padding-bottom: 3px; }
  .column-title span:first-child::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: var(--radar-dim);
  }

  .brand { font-family: var(--mono); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--radar); }
  h1 { margin: 4px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .tagline { margin: 4px 0 0; color: var(--ink-dim); font-size: 13.5px; }

  .stats { margin-left: auto; display: flex; gap: 34px; }
  .stat { text-align: right; }
  .stat .num {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat.hi .num { color: var(--radar); text-shadow: 0 0 16px rgba(57,233,145,0.45); }
  .stat .label { margin-top: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }

  /* ---------- CONTROLS ---------- */
  .controls { padding: 16px 32px; display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--panel-line); }
  .controls input, .controls select {
    background: var(--panel); border: 1px solid var(--panel-line); color: var(--ink);
    padding: 9px 13px; border-radius: 7px; font-family: var(--sans); font-size: 13px;
  }
  .controls input:focus, .controls select:focus { outline: 2px solid var(--radar); outline-offset: 1px; }
  .controls input { flex: 1; min-width: 200px; }

  /* ---------- BOARD ---------- */
  .board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; padding: 20px 32px 40px; }
  @media (max-width: 1000px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; } .hero { flex-wrap: wrap; } .stats { margin-left: 0; } }

  .column-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .column-title .count { background: var(--panel-line); color: var(--ink); border-radius: 10px; padding: 1px 8px; font-size: 11px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-left: 3px solid var(--radar-dim);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    animation: card-in 0.4s ease forwards;
    transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .card:hover { border-left-color: var(--radar); transform: translateX(2px); box-shadow: 0 4px 18px -6px rgba(57,233,145,0.25); }
  @keyframes card-in { to { opacity: 1; transform: translateY(0); } }

  .card .title { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .score { display: inline-block; padding: 1px 7px; border-radius: 4px; font-weight: 700; }
  .score.hi { background: rgba(57,233,145,0.15); color: var(--radar); }
  .score.mid { background: rgba(242,169,60,0.15); color: var(--amber); }
  .score.lo { background: rgba(239,100,89,0.15); color: var(--red); }

  .empty-col { font-family: var(--mono); font-size: 12px; color: var(--panel-line); padding: 20px 0; text-align: center; }

  /* ---------- MODAL ---------- */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(4,7,11,0.72); align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 24px; animation: modal-in 0.18s ease; }
  @keyframes modal-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  .modal h2 { margin-top: 0; font-size: 18px; }
  .modal .src { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-bottom: 16px; }
  .modal .pitch-box { background: var(--bg); border: 1px solid var(--panel-line); border-radius: 6px; padding: 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; margin: 10px 0 16px; }
  .modal .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .modal button, .modal a.btn {
    background: var(--radar); color: #06170f; border: none; padding: 8px 14px; border-radius: 6px;
    font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .modal button.secondary { background: transparent; border: 1px solid var(--panel-line); color: var(--ink); }
  .close-x { float: right; background: none; border: none; color: var(--ink-dim); font-size: 20px; cursor: pointer; line-height: 1; }
  .close-x:hover { color: var(--ink); }

  #empty-state { font-family: var(--mono); color: var(--ink-dim); padding: 60px 32px; text-align: center; font-size: 13px; }
</style>
</head>
<body>

<div class="scan-line" aria-hidden="true"></div>

<div class="hero">
  <div class="radar-wrap" aria-hidden="true">
    <div class="radar-ring"></div>
    <div class="radar-ring r2"></div>
    <div class="radar-ring r3"></div>
    <div class="radar-ring r4"></div>
    <div class="radar-sweep"></div>
    <div class="radar-core"></div>
    <div class="blip" id="blip-a" style="top: 30%; left: 62%; animation-delay: 0.2s;"></div>
    <div class="blip" id="blip-b" style="top: 68%; left: 40%; animation-delay: 1.1s;"></div>
    <div class="blip" id="blip-c" style="top: 45%; left: 22%; animation-delay: 1.8s;"></div>
  </div>
  <div>
    <div class="brand"><span class="live-dot" aria-hidden="true"></span>LEAD RADAR</div>
    <h1>Job Hunter — Full-Stack / Mobile / AI</h1>
    <div class="tagline">Scanning RemoteOK, We Work Remotely, Remotive &amp; Working Nomads every 6 hours</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" data-target="0" id="stat-total">0</div><div class="label">Tracked</div></div>
    <div class="stat hi"><div class="num" data-target="0" id="stat-new">0</div><div class="label">New</div></div>
    <div class="stat"><div class="num" data-target="0" id="stat-hi">0</div><div class="label">Score 8+</div></div>
  </div>
</div>

<div class="controls">
  <input id="search" type="text" placeholder="Filter by title, source, keyword…">
  <select id="source-filter"><option value="">All sources</option></select>
</div>

<div class="board" id="board"></div>
<div id="empty-state" style="display:none;">
  No jobs.json data yet. Run <code>python agent.py</code> once (with your API keys set) to populate this dashboard.
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const STAGES = ["new", "pitched", "won", "in_progress", "delivered", "paid"];
const STAGE_LABELS = { new: "New", pitched: "Pitched", won: "Won", in_progress: "In Progress", delivered: "Delivered", paid: "Paid" };
let JOBS = {};

function scoreClass(score) {
  if (score >= 8) return "hi";
  if (score >= 6) return "mid";
  return "lo";
}

function animateCount(el, target) {
  const start = 0;
  const duration = 700;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const searchTerm = document.getElementById("search").value.toLowerCase();
  const sourceFilter = document.getElementById("source-filter").value;

  const jobList = Object.values(JOBS).filter(j => {
    const text = `${j.title} ${j.source}`.toLowerCase();
    return (!searchTerm || text.includes(searchTerm)) && (!sourceFilter || j.source === sourceFilter);
  });

  animateCount(document.getElementById("stat-total"), Object.keys(JOBS).length);
  animateCount(document.getElementById("stat-new"), Object.values(JOBS).filter(j => j.status === "new").length);
  animateCount(document.getElementById("stat-hi"), Object.values(JOBS).filter(j => j.score >= 8).length);

  let cardDelay = 0;
  STAGES.forEach(stage => {
    const col = document.createElement("div");
    const stageJobs = jobList.filter(j => (j.status || "new") === stage).sort((a, b) => (b.score || 0) - (a.score || 0));
    col.innerHTML = `<div class="column-title"><span>${STAGE_LABELS[stage]}</span><span class="count">${stageJobs.length}</span></div>`;
    if (stageJobs.length === 0) col.innerHTML += `<div class="empty-col">—</div>`;

    stageJobs.forEach(job => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = `${Math.min(cardDelay, 600)}ms`;
      cardDelay += 35;
      card.onclick = () => openModal(job.id);
      card.innerHTML = `
        <div class="title">${escapeHtml(job.title)}</div>
        <div class="meta"><span>${escapeHtml(job.source)}</span><span class="score ${scoreClass(job.score || 0)}">${job.score ?? "?"}/10</span></div>`;
      col.appendChild(card);
    });
    board.appendChild(col);
  });
}

function openModal(id) {
  const job = JOBS[id];
  const modal = document.getElementById("modal-content");
  const stageOptions = STAGES.map(s => `<option value="${s}" ${job.status===s?"selected":""}>${STAGE_LABELS[s]}</option>`).join("");
  modal.innerHTML = `
    <button class="close-x" onclick="closeModal()">×</button>
    <h2>${escapeHtml(job.title)}</h2>
    <div class="src">${escapeHtml(job.source)} · score ${job.score ?? "?"}/10 · found ${new Date(job.found_at).toLocaleDateString()}</div>
    <div class="pitch-box">${escapeHtml(job.pitch || "No pitch generated.")}</div>
    <div class="row">
      <label style="font-family:var(--mono);font-size:12px;color:var(--ink-dim);align-self:center;">Stage:</label>
      <select id="stage-select" onchange="updateStage('${id}', this.value)">${stageOptions}</select>
      <a class="btn" href="${job.url}" target="_blank" rel="noopener">Open listing ↗</a>
      <button class="secondary" onclick="copyPitch('${id}')">Copy pitch</button>
    </div>`;
  document.getElementById("overlay").classList.add("open");
}
function closeModal() { document.getElementById("overlay").classList.remove("open"); }
function updateStage(id, newStage) { JOBS[id].status = newStage; render(); }
function copyPitch(id) { navigator.clipboard.writeText(JOBS[id].pitch || ""); }
function escapeHtml(str) { const div = document.createElement("div"); div.textContent = str || ""; return div.innerHTML; }

async function init() {
  try {
    const resp = await fetch("../data/jobs.json?_=" + Date.now());
    if (!resp.ok) throw new Error("no data file");
    JOBS = await resp.json();
    if (Object.keys(JOBS).length === 0) { document.getElementById("empty-state").style.display = "block"; return; }
    const sources = [...new Set(Object.values(JOBS).map(j => j.source))];
    const sel = document.getElementById("source-filter");
    sources.forEach(s => { const opt = document.createElement("option"); opt.value = s; opt.textContent = s; sel.appendChild(opt); });
    render();
  } catch (e) {
    document.getElementById("empty-state").style.display = "block";
  }
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("source-filter").addEventListener("change", render);
document.getElementById("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });

init();
</script>
</body>
</html>
